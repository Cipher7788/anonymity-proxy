rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="proxy",instance="proxy:8080"}'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: ProxyDown
        exp_alerts:
          - exp_labels: {job: proxy, instance: 'proxy:8080', severity: critical}
            exp_annotations: {summary: Proxy TLS or metrics endpoint is unavailable}
  - interval: 1m
    input_series:
      - series: 'up{job="proxy",instance="proxy:8080"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: ProxyDown
        exp_alerts: []
