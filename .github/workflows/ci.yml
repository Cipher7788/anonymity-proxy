name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/proxy
      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test ./internal/proxy -run=^$ -fuzz=FuzzValidateTarget -fuzztime=15s
      - run: docker build -t anonymity-proxy:ci .
